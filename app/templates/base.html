<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mesh collector{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1><a href="/" style="color:inherit">Mesh collector</a></h1>
    <span class="meta" id="live-subtitle" data-live>{% block subtitle %}{% endblock %}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
