<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1b1b">
  <title>{% block title %}Mesh collector{% endblock %}</title>
  <link rel="preload" href="{{ url_for('static', path='fonts/inter-latin-wght.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <div class="titles">
      <h1><a href="/">{% block heading %}Mesh collector{% endblock %}</a></h1>
      <p class="subtitle" id="live-subtitle" data-live>{% block subtitle %}{% endblock %}</p>
    </div>
    <div class="top-right" id="live-route" data-live>{% block route %}{% endblock %}</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
