# DigitalOcean App Platform: one container, auto-deploys on every push to main.
# Data lives in SQLite on the container disk and is wiped on each deploy/restart.
# Optional secrets (set in the control panel, not here: the repo is public):
#   INGEST_TOKEN, DASHBOARD_PASSWORD
name: mesh-collector
region: fra
services:
  - name: web
    github:
      repo: RRokas/mesh-collector
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
