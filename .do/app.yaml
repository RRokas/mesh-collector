# DigitalOcean App Platform spec.  doctl apps create --spec .do/app.yaml
# NOTE: App Platform serves HTTPS only (HTTP is 301-redirected), so the
# routers must have Python's ssl module before you use this path.
name: mesh-collector
region: fra
services:
  - name: web
    github:
      repo: RRokas/mesh-collector
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: INGEST_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: change-me
      - key: DASHBOARD_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: change-me
      - key: DECODE_MODE
        scope: RUN_TIME
        value: router
databases:
  - name: db
    engine: PG
    production: false
